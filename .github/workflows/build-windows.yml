name: Build Windows

on:
  # Manual runs from the Actions tab. Pick the branch in the "Run workflow"
  # dropdown — the workflow only ever builds what is already pushed.
  workflow_dispatch:

  # Pushing a tag like v4.1.0 builds the archive and attaches it to the
  # matching GitHub Release.
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  windows:
    name: Windows x64
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # full history + tags, so the release notes can diff against the
          # previous tag (the default shallow clone has neither)
          fetch-depth: 0

      # keep this in sync with .fvmrc and the `flutter:` constraint in pubspec.yaml
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.5
          channel: stable
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      # analysis errors are real errors: fail here instead of burning a full
      # release build on code that cannot compile
      - name: Analyze
        run: flutter analyze --no-pub

      # the unit tests are fast and caught a real crash (see the path ?? id fix
      # in my_audio_metadata), so run them before spending time on the build
      - name: Test
        run: flutter test

      - name: Build Windows release
        run: flutter build windows --release

      # Flutter moved the runner output into an arch subdirectory at some point,
      # so accept both layouts instead of hardcoding one.
      - name: Package
        shell: pwsh
        run: |
          $release = if (Test-Path 'build/windows/x64/runner/Release') {
            'build/windows/x64/runner/Release'
          } else {
            'build/windows/runner/Release'
          }
          # match the upstream naming and layout: sylvakru-<version>-windows.zip
          # whose single top-level entry is the Release/ folder
          $version = (Select-String -Path pubspec.yaml -Pattern '^version:\s*([0-9]+\.[0-9]+\.[0-9]+)').Matches[0].Groups[1].Value
          $zip = "sylvakru-$version-windows.zip"
          Write-Host "Packaging $release -> $zip"
          Get-ChildItem $release | Select-Object Name

          # Compress-Archive writes backslash separators on Windows PowerShell
          # and the leading-folder behaviour differs across versions, so build
          # the archive explicitly: forward slashes, one Release/ root, same as
          # the upstream zips.
          Add-Type -AssemblyName System.IO.Compression
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $full = (Resolve-Path $release).Path
          $root = Split-Path $full -Leaf
          if (Test-Path $zip) { Remove-Item $zip -Force }
          $archive = [System.IO.Compression.ZipFile]::Open($zip, 'Create')
          try {
            Get-ChildItem $full -Recurse -File | ForEach-Object {
              $rel = $_.FullName.Substring($full.Length).TrimStart('\', '/') -replace '\\', '/'
              [System.IO.Compression.ZipFileExtensions]::CreateEntryFromFile(
                $archive, $_.FullName, "$root/$rel",
                [System.IO.Compression.CompressionLevel]::Optimal) | Out-Null
            }
          } finally {
            $archive.Dispose()
          }
          $size = (Get-Item $zip).Length / 1MB
          Write-Host ("Archive size: {0:N1} MB" -f $size)
          "ZIP_NAME=$zip" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sylvakru-windows-x64
          path: sylvakru-*-windows.zip
          retention-days: 30

      # only on tag pushes; a manual run just leaves the artifact above
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag.TrimStart('v')

          # git prints UTF-8; without this a non-UTF-8 console mangles every
          # non-ASCII commit message
          [Console]::OutputEncoding = New-Object System.Text.UTF8Encoding($false)
          $OutputEncoding = New-Object System.Text.UTF8Encoding($false)

          # Build the notes from the commits since the previous tag, using each
          # commit's full body (not just the subject) so the release explains
          # what changed and why.
          $prev = git describe --tags --abbrev=0 "$tag^" 2>$null
          $range = if ($LASTEXITCODE -eq 0 -and $prev) { "$prev..$tag" } else { $tag }
          Write-Host "Collecting changes from $range"

          $lines = New-Object System.Collections.Generic.List[string]
          $lines.Add('## 本次改动')
          $lines.Add('')
          # skip the version-bump chore commits, they say nothing useful
          $commits = git log --no-merges --pretty=format:'%s%n%b%n---END---' $range |
            ForEach-Object { $_ } | Out-String
          $entries = $commits -split '---END---' | Where-Object { $_.Trim() -ne '' }
          $any = $false
          foreach ($entry in $entries) {
            $body = $entry.Trim()
            if ($body -eq '') { continue }
            $first = ($body -split "`n")[0].Trim()
            $rest = ($body -split "`n" | Select-Object -Skip 1) -join "`n"
            # skip the version-bump chores: they carry no body and say nothing
            # useful. Matching on "chore:" + empty body keeps this independent of
            # the message language.
            if ($first -match '^chore:' -and $rest.Trim() -eq '') { continue }
            $any = $true
            $lines.Add("### $first")
            if ($rest.Trim() -ne '') {
              $lines.Add('')
              $lines.Add($rest.Trim())
            }
            $lines.Add('')
          }
          if (-not $any) {
            $lines.Add('（本次仅包含版本号变更）')
            $lines.Add('')
          }

          $lines.Add('## 下载')
          $lines.Add('')
          $lines.Add("- ``$env:ZIP_NAME`` — Windows x64 免安装，解压后运行 ``Release/Sylvakru.exe``")
          $lines.Add('')
          if ($prev) {
            $lines.Add("**完整对比**: https://github.com/${{ github.repository }}/compare/$prev...$tag")
          }

          $notesPath = Join-Path $env:RUNNER_TEMP 'release-notes.md'
          [System.IO.File]::WriteAllText($notesPath, ($lines -join "`n"), (New-Object System.Text.UTF8Encoding($false)))
          Write-Host "----- release notes -----"
          Get-Content $notesPath | Write-Host

          gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --title "Sylvakru $version" --notes-file $notesPath
          } else {
            # keep an existing release's notes in sync on a re-run
            gh release edit $tag --notes-file $notesPath
          }
          gh release upload $tag $env:ZIP_NAME --clobber
