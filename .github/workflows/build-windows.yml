name: Build Windows

on:
  # Manual runs from the Actions tab. Pick the branch in the "Run workflow"
  # dropdown — the workflow only ever builds what is already pushed.
  workflow_dispatch:

  # Pushing a tag like v4.1.0 builds the archive and attaches it to the
  # matching GitHub Release.
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  windows:
    name: Windows x64
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # keep this in sync with .fvmrc and the `flutter:` constraint in pubspec.yaml
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.2
          channel: stable
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      # analysis errors are real errors: fail here instead of burning a full
      # release build on code that cannot compile
      - name: Analyze
        run: flutter analyze --no-pub

      - name: Build Windows release
        run: flutter build windows --release

      # Flutter moved the runner output into an arch subdirectory at some point,
      # so accept both layouts instead of hardcoding one.
      - name: Package
        shell: pwsh
        run: |
          $release = if (Test-Path 'build/windows/x64/runner/Release') {
            'build/windows/x64/runner/Release'
          } else {
            'build/windows/runner/Release'
          }
          Write-Host "Packaging $release"
          Get-ChildItem $release | Select-Object Name
          Compress-Archive -Path "$release/*" -DestinationPath sylvakru-windows-x64.zip -Force
          $size = (Get-Item sylvakru-windows-x64.zip).Length / 1MB
          Write-Host ("Archive size: {0:N1} MB" -f $size)

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sylvakru-windows-x64
          path: sylvakru-windows-x64.zip
          retention-days: 30

      # only on tag pushes; a manual run just leaves the artifact above
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${{ github.ref_name }}" 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create "${{ github.ref_name }}" --title "${{ github.ref_name }}" --generate-notes
          }
          gh release upload "${{ github.ref_name }}" sylvakru-windows-x64.zip --clobber
