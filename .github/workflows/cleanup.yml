name: Prune Actions storage

# This account's Actions storage is 0.5 GB and it filled up: five releases had
# left 10.4 GB of Flutter SDK caches behind, because a cache is scoped to the
# ref that created it and every release runs on its own tag.
#
# The release workflow now cleans up after its own successful tag builds. This
# is the backstop for everything else - a failed build, a manual run nobody
# downloaded, a cache left by an older workflow - so the quota cannot creep back
# up unnoticed.
#
# Runs weekly, and on demand from the Actions tab.

on:
  workflow_dispatch:
  schedule:
    # Mondays, 04:17 UTC
    - cron: '17 4 * * 1'

permissions:
  # deleting artifacts and caches
  actions: write
  contents: read

jobs:
  prune:
    name: Prune artifacts and caches
    runs-on: ubuntu-latest
    steps:
      # A day of grace. A run that is still going, or an artifact somebody is
      # about to download, must not be swept out from under them.
      - name: Delete artifacts older than a day
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cutoff=$(date -u -d '1 day ago' +%Y-%m-%dT%H:%M:%SZ)
          echo "Artifacts created before $cutoff"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" \
            --jq ".artifacts[] | select(.created_at < \"$cutoff\") | .id" |
          while read -r id; do
            [ -z "$id" ] && continue
            echo "deleting artifact $id"
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$id"
          done
          echo "Artifacts done."

      - name: Delete caches older than a day
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cutoff=$(date -u -d '1 day ago' +%s)
          echo "Caches created before $(date -u -d @$cutoff)"
          gh api "repos/$GITHUB_REPOSITORY/actions/caches?per_page=100" \
            --jq '.actions_caches[] | "\(.id) \(.created_at)"' |
          while read -r id created; do
            [ -z "$id" ] && continue
            if [ "$(date -u -d "$created" +%s)" -lt "$cutoff" ]; then
              echo "deleting cache $id ($created)"
              gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/caches/$id"
            fi
          done
          echo "Caches done."

      - name: What is left
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          artifacts=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" --jq '.total_count')
          caches=$(gh api "repos/$GITHUB_REPOSITORY/actions/caches?per_page=100" --jq '.total_count')
          echo "artifacts left: $artifacts"
          echo "caches left: $caches"
